<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/96/lucky-block.png">
    <title>Nana Kuji 뽑기판</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 22px; margin: 0 0 8px 0; color: #1a1a1a; }
        
        /* 상품 수량 안내 */
        .prize-info {
            background: #fff5f5;
            border: 1px solid #ffc9c9;
            border-radius: 12px;
            padding: 10px;
            font-size: 13px;
            color: #c92a2a;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }

        /* 참여자 입력 폼 */
        .user-form {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }
        .user-form input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .user-form button {
            padding: 10px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 5x4 그리드 뽑기판 */
        .kuji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4열 */
            gap: 10px;
            margin-bottom: 16px;
            perspective: 1000px;
        }

        /* 카드 뒤집기 3D 스타일 */
        .card {
            aspect-ratio: 3 / 4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }
        .card.disabled { cursor: not-allowed; }
        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 4px;
        }

        /* 카드 앞면 */
        .card-front {
            background: linear-gradient(135deg, #ff8787, #ff6b6b);
            color: white;
            border: 2px solid #ff8787;
            font-size: 16px;
        }
        .card-front::after {
            content: '🎁';
            font-size: 18px;
            margin-top: 4px;
        }

        /* 카드 뒷면 (뽑힌 상태) */
        .card-back {
            background: #fff;
            border: 2px solid #ff8787;
            color: #333;
            transform: rotateY(180deg);
            font-size: 10px;
            text-align: center;
            word-break: keep-all;
            line-height: 1.2;
        }
        .card-back .badge {
            font-size: 14px;
            font-weight: 900;
            color: #e03131;
            margin-bottom: 4px;
        }

        /* 관리자 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            max-height: 70vh;
            overflow-y: auto;
            text-align: left;
        }
        .admin-list { list-style: none; padding: 0; margin: 10px 0; font-size: 13px; }
        .admin-list li { padding: 6px 0; border-bottom: 1px solid #eee; }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Nana Kuji 뽑기판 ✨</h1>

        <!-- 상품 구성 표기 -->
        <div class="prize-info">
            <span>🥇 A상 (3개)</span>
            <span>🥈 B상 (7개)</span>
            <span>🥉 C상 (10개)</span>
        </div>

        <!-- 이름 입력 영역 -->
        <div class="user-form" id="user-section">
            <input type="text" id="username-input" placeholder="이름을 입력해 주세요">
            <button id="start-btn">입력</button>
        </div>

        <!-- 5x4 (20개) 뽑기판 -->
        <div class="kuji-grid" id="grid"></div>

        <!-- 초기화 버튼 -->
        <button class="btn-reset" id="reset-btn">판 초기화 (새 20개 생성)</button>
    </div>

    <!-- 관리자용 모달 -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3>👑 관리자 전용 목록</h3>
            <ul class="admin-list" id="admin-list"></ul>
            <button onclick="closeAdmin()" style="width:100%; padding:8px; margin-top:10px;">닫기</button>
        </div>
    </div>

    <script>
        // Supabase 설정
        const SUPABASE_URL = 'https://qowkwhcfbdfxmyuvwzox.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... (전체 Anon Key 입력)'; 

        let supabaseClient = null;
        let currentUser = "";

        // 당첨 문구 정의
        const PRIZE_TEXTS = {
            A: "A상 당첨! 스페셜 기프트에 배달까지!",
            B: "B상 당첨! 스페셜 기프트 당첨!",
            C: "C상 당첨! 주인장+먼작귀 셀카 증정!"
        };

        // 초기 20개 뽑기 구성 (A: 3개, B: 7개, C: 10개)
        const DEFAULT_CARDS = [
            'A','A','A',
            'B','B','B','B','B','B','B',
            'C','C','C','C','C','C','C','C','C','C'
        ];

        // 20개 카드의 상태 관리 (서버 공유용)
        let cardsState = []; // [{ id: 0, prize: 'A', drawn: false, drawnBy: '' }, ...]
        let drawHistory = [];

        async function init() {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            await loadBoardState();
            renderGrid();
        }

        // 서버에서 뽑기판 상태 읽기
        async function loadBoardState() {
            if (!supabaseClient) {
                initLocalCards();
                return;
            }
            try {
                const { data } = await supabaseClient.from('kuji_board').select('*').eq('id', 1).single();
                if (data && data.cards) {
                    cardsState = data.cards;
                    drawHistory = data.history || [];
                } else {
                    initLocalCards();
                    await saveBoardState();
                }
            } catch (err) {
                initLocalCards();
            }
        }

        // 새로운 20개 판 셔플 초기화
        function initLocalCards() {
            const shuffled = [...DEFAULT_CARDS].sort(() => Math.random() - 0.5);
            cardsState = shuffled.map((prize, idx) => ({
                id: idx,
                prize: prize,
                drawn: false,
                text: PRIZE_TEXTS[prize],
                drawnBy: ''
            }));
            drawHistory = [];
        }

        // 서버에 뽑기판 저장
        async function saveBoardState() {
            if (!supabaseClient) return;
            await supabaseClient.from('kuji_board').upsert({
                id: 1,
                cards: cardsState,
                history: drawHistory
            });
        }

        // 5x4 그리드 출력
        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            cardsState.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.drawn ? 'flipped disabled' : ''}`;
                
                cardEl.innerHTML = `
                    <div class="card-face card-front">${index + 1}</div>
                    <div class="card-face card-back">
                        <div class="badge">${card.prize}상</div>
                        <div>${card.text || ''}</div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(index));
                gridEl.appendChild(cardEl);
            });
        }

        // 카드 클릭 이벤트 handling
        async function handleCardClick(index) {
            const card = cardsState[index];

            // 1. 이름 미입력 검사
            if (!currentUser) {
                alert('먼저 이름을 입력하고 제출해 주세요!');
                document.getElementById('username-input').focus();
                return;
            }

            // 2. 이미 뽑힌 카드 처리
            if (card.drawn) {
                alert('이미 뽑힌 카드입니다!');
                return;
            }

            // 3. 뽑기 실행
            card.drawn = true;
            card.drawnBy = currentUser;
            drawHistory.push({
                user: currentUser,
                prize: card.prize,
                cardIndex: index + 1,
                date: new Date().toLocaleTimeString()
            });

            renderGrid();
            await saveBoardState();
        }

        // 이름 제출/시작 버튼
        document.getElementById('start-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('username-input').value.trim();
            if (!nameInput) {
                alert('이름을 입력해 주세요!');
                return;
            }

            // 관리자 로그인 분기
            if (nameInput === '관리자이하나') {
                showAdminModal();
                return;
            }

            currentUser = nameInput;
            alert(`안녕하세요 ${currentUser}님! 원하시는 번호의 뽑기를 클릭해 보세요.`);
            document.getElementById('username-input').disabled = true;
            document.getElementById('start-btn').innerText = '참여중';
            document.getElementById('start-btn').disabled = true;
        });

        // 관리자 모달 표시
        function showAdminModal() {
            const listEl = document.getElementById('admin-list');
            listEl.innerHTML = '';
            if (drawHistory.length === 0) {
                listEl.innerHTML = '<li>아직 참여 내역이 없습니다.</li>';
            } else {
                drawHistory.forEach(h => {
                    const li = document.createElement('li');
                    li.innerText = `[${h.date}] ${h.user}님 ➡️ ${h.cardIndex}번 선택 (${h.prize}상)`;
                    listEl.appendChild(li);
                });
            }
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        // 초기화 버튼 (새로운 20개 판 생성)
        document.getElementById('reset-btn').addEventListener('click', async () => {
            if (confirm('모든 뽑기를 초기화하고 새로운 20개 판을 만드시겠습니까?')) {
                initLocalCards();
                renderGrid();
                await saveBoardState();
                alert('새로운 20개 뽑기판이 준비되었습니다!');
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
