<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나나 쿠지</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --primary-color: #ff9ebb;
      --primary-hover: #ff7ba3;
      --text-color: #4a4a4a;
      --accent-color: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 460px;
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 2px solid #f0e6df;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #ff6b81;
      margin-bottom: 12px;
    }

    /* 상 정보 표시 현황 (4번 조건) */
    .prize-info {
      display: flex;
      justify-content: space-around;
      background: #fff5f7;
      border: 1px dashed #ffc2d1;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #444;
    }

    .prize-info span b {
      color: #ff4757;
    }

    /* 참여자 이름 입력 레이아웃 (7번 조건) */
    .user-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .user-form input {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      border: 2px solid #f0e6df;
      border-radius: 12px;
      outline: none;
    }

    .user-form input:focus {
      border-color: var(--primary-color);
    }

    .user-form button {
      padding: 0 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .user-form button:hover {
      background-color: var(--primary-hover);
    }
