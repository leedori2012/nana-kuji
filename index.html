<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/96/lucky-block.png">
    <title>Nana Kuji 뽑기</title>
    <!-- Supabase CDN (UMD 빌드 버전으로 사파리 호환성 강화) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }
        .status { font-size: 14px; color: #666; margin-bottom: 20px; }
        .count-badge { font-weight: bold; color: #ff6b6b; font-size: 16px; }
        .kuji-box {
            width: 100%;
            height: 160px;
            background: #fff0f0;
            border: 2px dashed #ffb8b8;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #e03131;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .kuji-box:active { transform: scale(0.97); background: #ffe3e3; }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        #draw-btn { background: #ff6b6b; color: white; }
        #draw-btn:disabled { background: #adb5bd; cursor: not-allowed; }
        #reset-btn { background: #e9ecef; color: #495057; }
        #result-area {
            margin-top: 20px;
            padding: 12px;
            background: #f1f3f5;
            border-radius: 10px;
            font-size: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading { color: #868e96; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nana Kuji 뽑기</h1>
        <div class="status">남은 뽑기 횟수: <span id="count" class="count-badge">20</span>개</div>
        
        <div class="kuji-box" id="kuji-trigger">
            🎁 터치해서 뽑기!
        </div>

        <div class="btn-group">
            <button id="draw-btn">뽑기 하기</button>
            <button id="reset-btn">초기화</button>
        </div>

        <div id="result-area">뽑기 버튼을 눌러주세요!</div>
        <div id="loading-text" class="loading">서버 연결 중...</div>
    </div>

    <script>
        // Supabase 설정 (사용자 정보 반영)
        const SUPABASE_URL = 'https://qowkwhcfbdfxmyuvwzox.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... (사용중이신 키 입력)'; 
        // ※ 본래 가지고 계신 전체 Anon Key 문자열을 그대로 넣어주세요.

        let supabaseClient = null;
        const PRIZES = ["A상: 대형 인형", "B상: 아크릴 스탠드", "C상: 키링", "D상: 캔뱃지", "꽝 (다음 기회에!)"];
        
        let state = {
            remaining: 20,
            history: []
        };

        // 사파리 및 모바일 환경 오류 방지를 위한 안전한 초기화
        async function init() {
            try {
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    document.getElementById('loading-text').innerText = '서버 연결 완료';
                    await loadStateFromSupabase();
                } else {
                    document.getElementById('loading-text').innerText = '오프라인 모드로 동작 중';
                }
            } catch (err) {
                console.error("초기화 오류:", err);
                document.getElementById('loading-text').innerText = '연결 실패 (로컬 모드)';
            }
            updateUI();
        }

        // Supabase에서 데이터 불러오기
        async function loadStateFromSupabase() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient
                .from('kuji_state')
                .select('*')
                .eq('id', 1)
                .single();
            
            if (data) {
                state.remaining = data.remaining !== undefined ? data.remaining : 20;
            } else {
                // 데이터가 없으면 기본값 생성
                await supabaseClient.from('kuji_state').upsert({ id: 1, remaining: 20 });
            }
        }

        // Supabase에 데이터 저장하기
        async function saveStateToSupabase(newRemaining) {
            if (!supabaseClient) return;
            await supabaseClient.from('kuji_state').upsert({ id: 1, remaining: newRemaining });
        }

        // 화면 UI 업데이트
        function updateUI() {
            document.getElementById('count').innerText = state.remaining;
            const drawBtn = document.getElementById('draw-btn');
            const kujiTrigger = document.getElementById('kuji-trigger');
            
            if (state.remaining <= 0) {
                drawBtn.disabled = true;
                kujiTrigger.style.opacity = '0.5';
                kujiTrigger.innerText = '뽑기가 모두 끝났습니다!';
            } else {
                drawBtn.disabled = false;
                kujiTrigger.style.opacity = '1';
                kujiTrigger.innerText = '🎁 터치해서 뽑기!';
            }
        }

        // 뽑기 실행 로직
        async function executeDraw() {
            if (state.remaining <= 0) {
                alert('뽑기 횟수가 모두 소진되었습니다. 초기화해 주세요!');
                return;
            }

            // 랜덤 상품 선택
            const randomPrize = PRIZES[Math.floor(Math.random() * PRIZES.length)];
            state.remaining -= 1;

            // UI 즉시 반영 (끊김 현상 방지)
            updateUI();
            document.getElementById('result-area').innerHTML = `🎉 당첨 결과: <b>${randomPrize}</b>`;

            // 백그라운드 서버 저장
            await saveStateToSupabase(state.remaining);
        }

        // 초기화 버튼 동작 (모든 뽑기 20개 다시 생성)
        async function executeReset() {
            if (confirm('정말 초기화하시겠습니까? 남은 횟수가 20개로 리셋됩니다.')) {
                state.remaining = 20;
                updateUI();
                document.getElementById('result-area').innerText = '뽑기가 초기화되었습니다!';
                await saveStateToSupabase(20);
            }
        }

        // 이벤트 리스너 연결 (사파리 터치 지연 방지 처리 포함)
        document.getElementById('draw-btn').addEventListener('click', executeDraw);
        document.getElementById('kuji-trigger').addEventListener('click', executeDraw);
        document.getElementById('reset-btn').addEventListener('click', executeReset);

        // 페이지 로드 시 실행
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
