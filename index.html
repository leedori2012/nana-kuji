<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일 사파리/인터넷 터치 및 화면 비율 최적화 (자동 확대 방지) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>나나쿠지</title>
  
  <!-- Supabase JS 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #ff4757;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 이름 입력 창 (아이폰 사파리 자동 확대 방지를 위해 font-size 16px 적용) */
    .input-section {
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .name-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px; 
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      text-align: center;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: border-color 0.2s;
    }

    .name-input:focus {
      border-color: #ff4757;
    }

    /* 관리자 전용 데이터 보기 버튼 */
    .admin-btn {
      display: none;
      width: 100%;
      padding: 12px;
      background-color: #2ed573;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(46, 213, 115, 0.2);
    }

    /* 쿠지 그리드 판 (5열 4행 = 총 20개) */
    .kuji-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
    }

    .kuji-card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #ff6b81, #ff4757);
      color: white;
      font-weight: 700;
      font-size: 18px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(255, 71, 87, 0.2);
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.1s ease, background 0.3s ease;
      text-align: center;
      padding: 4px;
      word-break: keep-all;
    }

    .kuji-card:active {
      transform: scale(0.95);
    }

    /* 오픈된 쿠지 카드의 스타일 (흔적 남기기) */
    .kuji-card.opened {
      cursor: default;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      transform: none;
    }

    .kuji-card.rank-a {
      background: #ffd700;
      color: #795548;
      border: 2px solid #ffb300;
    }

    .kuji-card.rank-b {
      background: #ff758c;
      color: #ffffff;
    }

    .kuji-card.rank-c {
      background: #e2e8f0;
      color: #4a5568;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }

    .rank-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.2;
    }

    .rank-desc {
      font-size: 9px;
      margin-top: 2px;
      opacity: 0.9;
      line-height: 1.1;
    }

    /* 관리자 대시보드 모달 */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .admin-modal-content {
      background: white;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .admin-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .record-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-item {
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .record-time {
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>나나쿠지 🎁</h1>

    <div class="input-section">
      <input type="text" id="userName" class="name-input" placeholder="참여자 이름을 입력해 주세요" autocomplete="off" />
      <button id="adminBtn" class="admin-btn" onclick="openAdminModal()">📋 관리자: 전체 결과 조회하기</button>
    </div>

    <!-- 5열 4행 (20개) 쿠지 판 -->
    <div class="kuji-grid" id="grid"></div>
  </div>

  <!-- 관리자용 현황 확인 모달 -->
  <div class="admin-modal" id="adminModal">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <span>전체 뽑기 기록</span>
        <button class="close-btn" onclick="closeAdminModal()">✕</button>
      </div>
      <div class="record-list" id="recordList">
        <p style="text-align:center; color:#888;">기록을 불러오는 중...</p>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. Supabase 접속 설정 (URL 및 키 적용 완료)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://stenxfgovxvpydguwurx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MIma1WJVuS0E2ghlj9rxzw_95O87v05"; 
    
    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error("Supabase 연동 오류:", e);
    }

    // -------------------------------------------------------------
    // 2. 상품 설정 (총 20개 : A상 3개, B상 7개, C상 10개)
    // -------------------------------------------------------------
    const initialPrizes = [
      ...Array(3).fill({ rank: "A상", text: "스페셜기프트+배달까지!", class: "rank-a" }),
      ...Array(7).fill({ rank: "B상", text: "스페셜기프트 당첨!", class: "rank-b" }),
      ...Array(10).fill({ rank: "C상", text: "주인장+먼작귀 셀카 당첨!", class: "rank-c" })
    ];

    // 무작위 셔플 (모든 칸 뽑기 확률 동일)
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const shuffledPrizes = shuffle(initialPrizes);

    // -------------------------------------------------------------
    // 3. UI 요소 생성 및 관리자 감지
    // -------------------------------------------------------------
    const gridContainer = document.getElementById("grid");
    const nameInput = document.getElementById("userName");
    const adminBtn = document.getElementById("adminBtn");

    // '관리자이하나' 감지
    nameInput.addEventListener("input", (e) => {
      const value = e.target.value.trim();
      if (value === "관리자이하나") {
        adminBtn.style.display = "block";
      } else {
        adminBtn.style.display = "none";
      }
    });

    // 20개 카드 배치
    shuffledPrizes.forEach((prizeObj, index) => {
      const card = document.createElement("div");
      card.className = "kuji-card";
      card.textContent = index + 1;
      card.dataset.rank = prizeObj.rank;
      card.dataset.text = prizeObj.text;
      card.dataset.cssClass = prizeObj.class;

      card.addEventListener("click", () => handleDraw(card));
      gridContainer.appendChild(card);
    });

    // -------------------------------------------------------------
    // 4. 뽑기 진행 함수
    // -------------------------------------------------------------
    async function handleDraw(card) {
      const name = nameInput.value.trim();

      if (!name) {
        alert("참여자 이름을 먼저 입력해 주세요!");
        nameInput.focus();
        return;
      }

      if (card.classList.contains("opened")) {
        return;
      }

      const rank = card.dataset.rank;
      const text = card.dataset.text;
      const cssClass = card.dataset.cssClass;

      // 카드 뽑은 상태로 변경 (흔적 남기기)
      card.classList.add("opened", cssClass);
      card.innerHTML = `
        <div class="card-content">
          <div class="rank-title">${rank}</div>
          <div class="rank-desc">${text}</div>
        </div>
      `;

      const resultValue = `${name} - ${rank}: ${text}`;

      // Supabase 데이터 저장
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from("nana_results")
            .insert([{ result_value: resultValue }]);

          if (error) {
            console.error("DB 저장 오류:", error);
          }
        } catch (err) {
          console.error("네트워크 오류:", err);
        }
      }

      // 당첨 안내 팝업
      setTimeout(() => {
        alert(`🎉 ${name}님 당첨 결과 🎉\n\n[ ${rank} ]\n${text}`);
      }, 100);
    }

    // -------------------------------------------------------------
    // 5. 관리자 기능 ('관리자이하나' 전용 기록 조회)
    // -------------------------------------------------------------
    async function openAdminModal() {
      const modal = document.getElementById("adminModal");
      const recordList = document.getElementById("recordList");
      modal.style.display = "flex";
      recordList.innerHTML = `<p style="text-align:center; color:#888;">기록을 불러오는 중...</p>`;

      if (!supabaseClient) {
        recordList.innerHTML = `<p style="text-align:center; color:#e74c3c;">Supabase 클라이언트 연동에 실패했습니다.</p>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from("nana_results")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        recordList.innerHTML = `<p style="text-align:center; color:#e74c3c;">불러오기 실패: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        recordList.innerHTML = `<p style="text-align:center; color:#888;">아직 참여한 기록이 없습니다.</p>`;
        return;
      }

      recordList.innerHTML = data.map(item => {
        const date = new Date(item.created_at).toLocaleString('ko-KR', {
          month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        return `
          <div class="record-item">
            <span><strong>${item.result_value}</strong></span>
            <span class="record-time">${date}</span>
          </div>
        `;
      }).join('');
    }

    function closeAdminModal() {
      document.getElementById("adminModal").style.display = "none";
    }
  </script>
</body>
</html>
