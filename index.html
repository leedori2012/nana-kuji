<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나나쿠지 럭키 드로우</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --primary-color: #ff9ebb;
      --primary-hover: #ff7ba3;
      --text-color: #4a4a4a;
      --accent-color: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 2px solid #f0e6df;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #ff6b81;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 24px;
    }

    .display-box {
      width: 100%;
      height: 180px;
      background: #fff5f7;
      border: 2px dashed #ffc2d1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .prize-rank {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ff4757;
      margin-bottom: 6px;
    }

    .prize-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2f3542;
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>나나쿠지 럭키 드로우</h1>
    <p class="subtitle">버튼을 눌러 뽑기를 시작해보세요!</p>
    
    <div class="display-box">
      <div class="prize-rank">?</div>
      <div class="prize-name">두근두근 결과는?</div>
    </div>

    <button class="btn">뽑기 하기</button>
  </div>
</body>
</html>
