<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나나 쿠지</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffeef2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 15px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
    }

    .title {
      text-align: center;
      color: #ff69b4;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* 참여자 영역 */
    .user-info {
      background: #fff5f7;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .user-name {
      color: #d81b60;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-change-name {
      background: #b0bec5;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 수량 판넬 */
    .stock-board {
      background: #fff5f7;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-bottom: 20px;
    }

    .stock-item {
      flex: 1;
    }

    .stock-label {
      font-size: 13px;
      color: #757575;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stock-count {
      font-size: 18px;
      font-weight: bold;
      color: #d81b60;
    }

    /* 버튼 영역 */
    .action-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-draw {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
      transition: background 0.2s;
    }

    .btn-draw:hover {
      background: #ff4081;
    }

    .btn-draw:disabled {
      background: #cccccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 결과 창 */
    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #fff;
      border: 2px dashed #ffb6c1;
      border-radius: 16px;
      text-align: center;
      font-size: 15px;
      color: #333;
      min-height: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">✨ 나나 쿠지 ✨</h1>

    <!-- 참여자 설정 -->
    <div class="user-info">
      <div class="user-name">참여자: <span id="participant-name">테스트님</span></div>
      <button class="btn-change-name" onclick="changeName()">이름 변경</button>
    </div>

    <!-- 남은 수량 현황 -->
    <div class="stock-board">
      <div class="stock-item">
        <div class="stock-label">A상 남은 수량</div>
        <div class="stock-count" id="count-a">0</div>
      </div>
      <div class="stock-item">
        <div class="stock-label">B상 남은 수량</div>
        <div class="stock-count" id="count-b">0</div>
      </div>
      <div class="stock-item">
        <div class="stock-label">C상 남은 수량</div>
        <div class="stock-count" id="count-c">0</div>
      </div>
    </div>

    <!-- 뽑기 버튼 및 결과 -->
    <div class="action-area">
      <button class="btn-draw" id="draw-btn" onclick="drawKuji()">쿠지 뽑기!</button>
      <div class="result-box" id="result-message">버튼을 눌러 뽑기를 시작하세요!</div>
    </div>
  </div>

  <script>
    // 1. 현재 수량 데이터 (숫자로 관리)
    let kujiStock = {
      A: 2,
      B: 3,
      C: 5
    };

    // 2. 화면에 수량 렌더링하는 함수 (여기서 [object HTMLElement] 오류 방지!)
    function updateStockDisplay() {
      document.getElementById('count-a').textContent = kujiStock.A;
      document.getElementById('count-b').textContent = kujiStock.B;
      document.getElementById('count-c').textContent = kujiStock.C; // 숫자 데이터만 출력

      const totalStock = kujiStock.A + kujiStock.B + kujiStock.C;
      const drawBtn = document.getElementById('draw-btn');

      if (totalStock === 0) {
        drawBtn.disabled = true;
        drawBtn.textContent = '품절되었습니다!';
      }
    }

    // 3. 뽑기 실행 함수
    function drawKuji() {
      const availablePrizes = [];

      // 남은 수량이 있는 상품만 배열에 가상 등록
      for (let prize in kujiStock) {
        for (let i = 0; i < kujiStock[prize]; i++) {
          availablePrizes.push(prize);
        }
      }

      if (availablePrizes.length === 0) {
        alert('모든 상품이 소진되었습니다!');
        return;
      }

      // 랜덤 뽑기 계산
      const randomIndex = Math.floor(Math.random() * availablePrizes.length);
      const winPrize = availablePrizes[randomIndex];

      // 차감 및 화면 업데이트
      kujiStock[winPrize]--;
      updateStockDisplay();

      // 결과 메시지 출력
      const userName = document.getElementById('participant-name').textContent;
      document.getElementById('result-message').innerHTML = 
        `🎉 <b>${userName}</b>님, <b>[ ${winPrize}상 ]</b> 당첨을 축하합니다!`;
    }

    // 4. 이름 변경 함수
    function changeName() {
      const newName = prompt('새로운 이름을 입력하세요:', '테스트님');
      if (newName && newName.trim() !== '') {
        document.getElementById('participant-name').textContent = newName.trim();
      }
    }

    // 첫 로딩 시 수량 표시 실행
    updateStockDisplay();
  </script>

</body>
</html>
