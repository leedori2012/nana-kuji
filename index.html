<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/96/lucky-block.png">
    <title>Nana Kuji 뽑기판</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 22px; margin: 0 0 8px 0; color: #1a1a1a; }
        
        /* 상품 수량 안내 */
        .prize-info {
            background: #fff5f5;
            border: 1px solid #ffc9c9;
            border-radius: 12px;
            padding: 10px;
            font-size: 13px;
            color: #c92a2a;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }

        /* 참여자 입력 폼 */
        .user-form {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }
        .user-form input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .user-form button {
            padding: 10px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 5x4 (총 20개) 그리드 뽑기판 */
        .kuji-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 한 줄에 5개씩 */
            gap: 8px;
            margin-bottom: 16px;
        }

        /* 뽑기 카드 스타일 */
        .card {
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #ff8787, #ff6b6b);
            color: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
            transition: transform 0.1s ease;
        }
        .card:active { transform: scale(0.95); }
        
        /* 이미 뽑힌 카드 (뜯긴 흔적: 상 이름만 심플하게 표시) */
        .card.drawn {
            background: #e9ecef;
            color: #868e96;
            cursor: not-allowed;
            font-size: 13px;
            border: 1px dashed #adb5bd;
        }

        /* 공통 모달(팝업) 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-top: 0; color: #ff6b6b; }
        .modal-msg { font-size: 15px; margin: 15px 0 20px 0; line-height: 1.4; word-break: keep-all; }
        
        .admin-list { list-style: none; padding: 0; margin: 10px 0; font-size: 13px; text-align: left; max-height: 150px; overflow-y: auto; }
        .admin-list li { padding: 6px 0; border-bottom: 1px solid #eee; }

        .modal-btn {
            width: 100%;
            padding: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-reset-admin {
            background: #fa5252;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Nana Kuji 뽑기판 ✨</h1>

        <!-- 상품 구성 표기 -->
        <div class="prize-info">
            <span>🥇 A상 (3개)</span>
            <span>🥈 B상 (7개)</span>
            <span>🥉 C상 (10개)</span>
        </div>

        <!-- 이름 입력 영역 -->
        <div class="user-form" id="user-section">
            <input type="text" id="username-input" placeholder="이름을 입력해 주세요">
            <button id="start-btn">확인</button>
        </div>

        <!-- 5x4 (20개) 뽑기판 -->
        <div class="kuji-grid" id="grid"></div>
    </div>

    <!-- 당첨 결과 팝업 모달 -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h3>🎉 당첨 결과</h3>
            <div class="modal-msg" id="result-msg-text">내용</div>
            <button class="modal-btn" onclick="closeResultModal()">확인</button>
        </div>
    </div>

    <!-- 관리자 전용 모달 (목록 및 초기화) -->
    <div class="modal" id="admin-modal">
        <div class="modal-content" style="text-align: left;">
            <h3>👑 관리자 모드</h3>
            <div style="font-size: 13px; font-weight: bold; margin-top: 8px;">참여자 목록:</div>
            <ul class="admin-list" id="admin-list"></ul>
            <button class="modal-btn btn-reset-admin" id="admin-reset-btn">판 초기화 (새 20개 생성)</button>
            <button onclick="closeAdminModal()" style="width:100%; padding:8px; margin-top:8px; background:#e9ecef; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">닫기</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qowkwhcfbdfxmyuvwzox.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... (전체 Anon Key 입력)'; 

        let supabaseClient = null;
        let currentUser = "";

        const PRIZE_TEXTS = {
            A: "A상 당첨! 스페셜 기프트에 배달까지!",
            B: "B상 당첨! 스페셜 기프트 당첨!",
            C: "C상 당첨! 주인장+먼작귀 셀카 증정!"
        };

        const DEFAULT_CARDS = [
            'A','A','A',
            'B','B','B','B','B','B','B',
            'C','C','C','C','C','C','C','C','C','C'
        ];

        let cardsState = [];
        let drawHistory = [];

        async function init() {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            await loadBoardState();
            renderGrid();
        }

        // 서버에서 최신 상태 불러오기
        async function loadBoardState() {
            if (!supabaseClient) {
                initLocalCards();
                return;
            }
            try {
                const { data } = await supabaseClient.from('kuji_board').select('*').eq('id', 1).single();
                if (data && data.cards) {
                    cardsState = data.cards;
                    drawHistory = data.history || [];
                } else {
                    initLocalCards();
                    await saveBoardState();
                }
            } catch (err) {
                initLocalCards();
            }
        }

        function initLocalCards() {
            const shuffled = [...DEFAULT_CARDS].sort(() => Math.random() - 0.5);
            cardsState = shuffled.map((prize, idx) => ({
                id: idx,
                prize: prize,
                drawn: false,
                text: PRIZE_TEXTS[prize],
                drawnBy: ''
            }));
            drawHistory = [];
        }

        async function saveBoardState() {
            if (!supabaseClient) return;
            await supabaseClient.from('kuji_board').upsert({
                id: 1,
                cards: cardsState,
                history: drawHistory
            });
        }

        // 5x4 그리드 렌더링
        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            cardsState.forEach((card, index) => {
                const cardEl = document.createElement('div');
                
                if (card.drawn) {
                    // 이미 뽑힌 경우: 뜯긴 흔적으로 상 이름만 심플하게 표시
                    cardEl.className = 'card drawn';
                    cardEl.innerText = `${card.prize}상`;
                } else {
                    // 안 뽑힌 경우: 번호 표시
                    cardEl.className = 'card';
                    cardEl.innerText = index + 1;
                    cardEl.addEventListener('click', () => handleCardClick(index));
                }

                gridEl.appendChild(cardEl);
            });
        }

        // 카드 클릭 시 뽑기 실행
        async function handleCardClick(index) {
            if (!currentUser) {
                alert('먼저 이름을 입력하고 확인을 눌러주세요!');
                document.getElementById('username-input').focus();
                return;
            }

            // 최신 상태를 서버에서 다시 동기화하여 겹침 방지
            await loadBoardState();
            if (cardsState[index].drawn) {
                alert('이미 다른 사람이 뽑은 카드입니다!');
                renderGrid();
                return;
            }

            const card = cardsState[index];
            card.drawn = true;
            card.drawnBy = currentUser;
            
            drawHistory.push({
                user: currentUser,
                prize: card.prize,
                cardIndex: index + 1,
                date: new Date().toLocaleTimeString()
            });

            renderGrid();
            await saveBoardState();

            // 당첨 팝업 띄우기
            showResultModal(card.text);
        }

        function showResultModal(text) {
            document.getElementById('result-msg-text').innerText = text;
            document.getElementById('result-modal').style.display = 'flex';
        }

        function closeResultModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // 이름 확인 버튼
        document.getElementById('start-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('username-input').value.trim();
            if (!nameInput) {
                alert('이름을 입력해 주세요!');
                return;
            }

            // 관리자 로그인 분기
            if (nameInput === '관리자이하나') {
                await loadBoardState();
                showAdminModal();
                return;
            }

            currentUser = nameInput;
            alert(`환영합니다, ${currentUser}님! 원하는 번호를 터치해 주세요.`);
            document.getElementById('username-input').disabled = true;
            document.getElementById('start-btn').innerText = '참여중';
            document.getElementById('start-btn').disabled = true;
        });

        function showAdminModal() {
            const listEl = document.getElementById('admin-list');
            listEl.innerHTML = '';
            if (drawHistory.length === 0) {
                listEl.innerHTML = '<li>아직 참여 내역이 없습니다.</li>';
            } else {
                drawHistory.forEach(h => {
                    const li = document.createElement('li');
                    li.innerText = `[${h.date}] ${h.user}님 ➡️ ${h.cardIndex}번 (${h.prize}상)`;
                    listEl.appendChild(li);
                });
            }
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        // 관리자 모달 내 초기화 버튼
        document.getElementById('admin-reset-btn').addEventListener('click', async () => {
            if (confirm('모든 뽑기를 초기화하고 새로운 20개 판을 만드시겠습니까?')) {
                initLocalCards();
                renderGrid();
                await saveBoardState();
                alert('새로운 20개 뽑기판이 생성되었습니다!');
                closeAdminModal();
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
