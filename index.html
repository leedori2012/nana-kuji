<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나나 쿠지</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffeef2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 15px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
    }

    .title {
      text-align: center;
      color: #ff69b4;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* 참여자 영역 */
    .user-info {
      background: #fff5f7;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .user-name {
      color: #d81b60;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-change-name {
      background: #b0bec5;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 수량 판넬 */
    .stock-board {
      background: #fff5f7;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-bottom: 20px;
    }

    .stock-item {
      flex: 1;
    }

    .stock-label {
      font-size: 13px;
      color: #757575;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stock-count {
      font-size: 18px;
      font-weight: bold;
      color: #d81b60;
    }

    /* 버튼 영역 */
    .action-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-draw {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
      transition: background 0.2s;
    }

    .btn-draw:hover {
      background: #ff4081;
    }

    .btn-draw:disabled {
      background: #cccccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 결과 창 */
    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #fff;
      border: 2px dashed #ffb6c1;
      border-radius: 16px;
      text-align: center;
      font-size: 15px;
      color: #333;
      min-height: 24px;
      font-weight: bold;
    }

    /* 관리자 히스토리 보기 영역 */
    .admin-section {
      margin-top: 24px;
      border-top: 1px solid #ffe4e8;
      padding-top: 16px;
    }

    .admin-toggle-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .history-list {
      display: none;
      margin-top: 12px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
      background: #fafafa;
      padding: 10px;
      border-radius: 12px;
    }

    .history-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">✨ 나나 쿠지 ✨</h1>

    <!-- 참여자 설정 -->
    <div class="user-info">
      <div class="user-name">참여자: <span id="participant-name">테스트님</span></div>
      <button class="btn-change-name" onclick="changeName()">이름 변경</button>
    </div>

    <!-- 남은 수량 현황 -->
    <div class="stock-board">
      <div class="stock-item">
        <div class="stock-label">A상 남은 수량</div>
        <div class="stock-count" id="count-a">-</div>
      </div>
      <div class="stock-item">
        <div class="stock-label">B상 남은 수량</div>
        <div class="stock-count" id="count-b">-</div>
      </div>
      <div class="stock-item">
        <div class="stock-label">C상 남은 수량</div>
        <div class="stock-count" id="count-c">-</div>
      </div>
    </div>

    <!-- 뽑기 버튼 및 결과 -->
    <div class="action-area">
      <button class="btn-draw" id="draw-btn" onclick="drawKuji()">쿠지 뽑기!</button>
      <div class="result-box" id="result-message">버튼을 눌러 뽑기를 시작하세요!</div>
    </div>

    <!-- 관리자 내역 조회 영역 -->
    <div class="admin-section">
      <button class="admin-toggle-btn" onclick="toggleAdminHistory()">🔒 관리자 뽑기 기록 확인</button>
      <div class="history-list" id="history-list">
        <!-- 뽑기 기록이 동적으로 들어옵니다 -->
      </div>
    </div>
  </div>

  <script>
    // 입력해주신 Supabase 연동 정보 반영 완료
    const SUPABASE_URL = 'https://stenxfgovxvpydguwurx.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_MIma1WJVuS0E2ghlj9rxzw_95O87v05';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let kujiStock = { A: 0, B: 0, C: 0 };

    // DB에서 실시간 수량 불러오기 & 화면 렌더링
    async function fetchStock() {
      const { data, error } = await supabaseClient
        .from('kuji_stock')
        .select('*');

      if (error) {
        console.error('수량 불러오기 실패:', error);
        return;
      }

      data.forEach(item => {
        kujiStock[item.prize_type] = item.count;
      });

      renderStock();
    }

    function renderStock() {
      document.getElementById('count-a').textContent = kujiStock.A;
      document.getElementById('count-b').textContent = kujiStock.B;
      document.getElementById('count-c').textContent = kujiStock.C;

      const totalStock = kujiStock.A + kujiStock.B + kujiStock.C;
      const drawBtn = document.getElementById('draw-btn');

      if (totalStock === 0) {
        drawBtn.disabled = true;
        drawBtn.textContent = '품절되었습니다!';
      } else {
        drawBtn.disabled = false;
        drawBtn.textContent = '쿠지 뽑기!';
      }
    }

    // 뽑기 실행 (동일 확률 계산 및 DB 차감/기록)
    async function drawKuji() {
      const drawBtn = document.getElementById('draw-btn');
      drawBtn.disabled = true;

      // 최신 수량 재확인
      await fetchStock();

      const availablePrizes = [];
      for (let prize in kujiStock) {
        for (let i = 0; i < kujiStock[prize]; i++) {
          availablePrizes.push(prize);
        }
      }

      if (availablePrizes.length === 0) {
        alert('모든 상품이 소진되었습니다!');
        drawBtn.disabled = true;
        return;
      }

      // 랜덤 뽑기 (남은 전체 쿠지 중 동등한 확률)
      const randomIndex = Math.floor(Math.random() * availablePrizes.length);
      const winPrize = availablePrizes[randomIndex];

      const userName = document.getElementById('participant-name').textContent;

      // DB 1: 수량 차감
      const newCount = kujiStock[winPrize] - 1;
      const { error: updateError } = await supabaseClient
        .from('kuji_stock')
        .update({ count: newCount })
        .eq('prize_type', winPrize);

      if (updateError) {
        alert('뽑기 처리 중 오류가 발생했습니다.');
        drawBtn.disabled = false;
        return;
      }

      // DB 2: 뽑기 기록 저장 (관리자 확인용)
      await supabaseClient
        .from('kuji_history')
        .insert([{ user_name: userName, prize: winPrize }]);

      // 화면 업데이트
      await fetchStock();

      document.getElementById('result-message').innerHTML = 
        `🎉 <b>${userName}</b>님, <b>[ ${winPrize}상 ]</b> 당첨을 축하합니다!`;
    }

    // 이름 변경 함수
    function changeName() {
      const newName = prompt('새로운 이름을 입력하세요:', '테스트님');
      if (newName && newName.trim() !== '') {
        document.getElementById('participant-name').textContent = newName.trim();
      }
    }

    // 관리자 전용 - 누가 뭘 뽑았는지 내역 보기
    async function toggleAdminHistory() {
      const historyList = document.getElementById('history-list');
      if (historyList.style.display === 'block') {
        historyList.style.display = 'none';
        return;
      }

      const { data, error } = await supabaseClient
        .from('kuji_history')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('기록을 불러오지 못했습니다.');
        return;
      }

      historyList.innerHTML = data.map(item => `
        <div class="history-item">
          <span><b>${item.user_name}</b>님</span>
          <span>${item.prize}상</span>
          <span style="color:#aaa; font-size:11px;">${new Date(item.created_at).toLocaleTimeString()}</span>
        </div>
      `).join('');

      historyList.style.display = 'block';
    }

    // 초기 로딩 시 데이터 조회
    fetchStock();
  </script>
</body>
</html>
